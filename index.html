
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Cat Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <p class="subtitle">A LITTLE DOSE OF HAPPINESS</p>

        <h1>Cat of the Day!</h1>

        <p class="description">
            Need a little break? Meet your new favourite cat.
        </p>

        <div class="cat-container">
            <p id="loading">Finding your cat...</p>
            <img id="cat-image" src="" alt="A random cute cat">
        </div>

        <div class="stats">
            <span>Cats discovered: <strong id="cat-count">0</strong></span>
            <span>Favourites: <strong id="like-count">0</strong></span>
        </div>

        <div class="extra-buttons">
            <button id="like-btn" disabled>♡ Like this cat</button>
            <button id="theme-btn">☾ Change Theme</button>
        </div>

        <button id="new-cat-btn">Show Me Another Cat ♡</button>

        <p id="error-message"></p>

        <p class="footer">Powered by The Cat API</p>

    </main>

    <script src="script.js"></script>
</body>
</html>
